name: Diagnóstico de fuentes
# Guarda en diag/ cómo responden las páginas de pipeline/diagnostico.txt, para ajustar fuentes.json.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/diagnostico.txt', 'pipeline/diagnostico.py']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests && python3 pipeline/diagnostico.py
      - run: |
          git config user.name "pausible-bot"; git config user.email "actions@users.noreply.github.com"
          git add diag && (git diff --cached --quiet || (git commit -q -m "Diagnóstico de fuentes" && for i in 1 2 3 4 5; do git push -q && break; sleep 7; git pull -q --rebase; done))
